  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true

  socialIcons = [
    { name = "github", url = "https://github.com/hazriqpedia" },
    { name = "linkedin", url = "https://www.linkedin.com/in/hazriqishak/" },
  ]


